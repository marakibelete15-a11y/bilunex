<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bilunex administrator portal — mentor applications." />
    <title>Mentor Applications | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/images/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-heading">Skip to content</a>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container portal-layout">
        <section class="portal-main">
          <header class="page-header">
            <h1 id="main-heading">Mentor applications</h1>
            <p>
              Review application details, download submitted documents and manage application
              status.
            </p>
          </header>
          <form id="filters" class="admin-filters">
            <label>Search this page<input name="search" type="search" /></label
            ><label
              >Status<select name="status">
                <option value="">All statuses</option>
                <option value="application_received">Application received</option>
                <option value="under_review">Under review</option>
                <option value="interview_stage">Interview stage</option>
                <option value="accepted">Accepted</option>
                <option value="rejected">Rejected</option>
                <option value="onboarding">Onboarding</option>
              </select></label
            ><button class="btn btn-primary" type="submit">Apply filter</button
            ><button class="btn btn-outline" type="button" id="reset-filters">Reset</button>
          </form>
          <div id="list-state" role="status" aria-live="polite"></div>
          <div id="applications-table"></div>
          <nav id="pagination" class="admin-pagination" aria-label="Application pages"></nav>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-applications.js"></script>
  </body>
</html>
