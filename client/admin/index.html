<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bilunex administrator portal — operations summary." />
    <title>Admin Dashboard | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-heading">Skip to content</a>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container portal-layout">
        <section class="portal-main">
          <header class="page-header">
            <h1 id="main-heading">Operations summary</h1>
            <p>Registration, recruitment and student support activity.</p>
          </header>
          <div id="dashboard-state" role="status" aria-live="polite"></div>
          <div id="summary-cards" class="admin-summary-grid"></div>
          <section class="card admin-failure-card">
            <h2>Failed notifications</h2>
            <p>
              Recorded delivery failures in the last 7 days:
              <strong id="failed-notifications">—</strong>
            </p>
          </section>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-dashboard.js"></script>
  </body>
</html>
