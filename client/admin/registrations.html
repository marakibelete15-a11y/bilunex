<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bilunex administrator portal — parent registrations." />
    <title>Parent Registrations | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/portal.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-heading">Skip to content</a>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container portal-layout">
        <section class="portal-main">
          <header class="page-header">
            <h1 id="main-heading">Parent Registrations</h1>
            <p>Manage and track all registered parents.</p>
          </header>

          <div id="registration-metrics" class="portal-metrics-grid"></div>

          <div class="admin-records-card card">
            <div class="records-header">
              <h2 id="records-title">Parent Registration Records</h2>
              <p>Search, filter and manage individual registrations.</p>
            </div>

            <form id="filters" class="admin-filters">
              <label
                >Search<input
                  name="search"
                  type="search"
                  placeholder="Search name, email, phone..."
              /></label>
              <label>
                Status
                <select name="status">
                  <option value="">All statuses</option>
                  <option value="new">New</option>
                  <option value="contacted">Contacted</option>
                  <option value="enrolled">Registered / Enrolled</option>
                  <option value="archived">Closed / Archived</option>
                </select>
              </label>
              <label>Grade<input name="grade_level" placeholder="e.g. Grade 8" /></label>
              <label>Subject<input name="subject" placeholder="e.g. Mathematics" /></label>
              <label>Date<input name="date" type="date" /></label>
              <button class="btn btn-primary" type="submit">Apply filters</button>
              <button class="btn btn-outline" type="button" id="reset-filters">Reset</button>
            </form>

            <div id="list-state" role="status" aria-live="polite"></div>
            <div id="registrations-table" class="table-responsive"></div>
            <nav id="pagination" class="admin-pagination" aria-label="Registration pages"></nav>
          </div>

          <!-- Modal for Parent Registration Details & Status Update -->
          <div id="registration-modal" class="portal-modal-backdrop" aria-hidden="true">
            <div
              class="portal-modal-card"
              role="dialog"
              aria-modal="true"
              aria-labelledby="modal-title"
            >
              <header class="portal-modal-header">
                <h2 id="modal-title">Registration Details</h2>
                <button
                  type="button"
                  class="portal-modal-close"
                  id="modal-close-btn"
                  aria-label="Close modal"
                >
                  &times;
                </button>
              </header>
              <div class="portal-modal-body" id="modal-body-content"></div>
              <footer class="portal-modal-footer" id="modal-actions">
                <button type="button" class="btn btn-outline" id="modal-cancel-btn">Close</button>
              </footer>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-registrations.js"></script>
  </body>
</html>
