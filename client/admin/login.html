<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Secure Bilunex administrator sign in." />
    <title>Admin Login | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <div id="portal-brand-banner"></div>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container">
        <section class="card admin-login-card">
          <h1>Administrator sign in</h1>
          <p>Use your Bilunex administrator account.</p>
          <form id="admin-login-form">
            <label>Email<input name="email" type="email" autocomplete="username" required /></label
            ><label
              >Password<input
                name="password"
                type="password"
                autocomplete="current-password"
                required /></label
            ><button class="btn btn-primary" type="submit">Sign in</button>
            <p id="login-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-login.js"></script>
  </body>
</html>
