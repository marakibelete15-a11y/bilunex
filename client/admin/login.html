<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="Secure Bilunex administrator sign in." />
    <title>Admin Login | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/portal.css" />
  </head>
  <body>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container">
        <section class="card admin-login-card">
          <h1>Administrator log in</h1>
          <p>Use your Bilunex administrator account.</p>
          <form id="admin-login-form">
            <div class="form-group">
              <label class="form-label" for="admin-email">Email</label>
              <input
                id="admin-email"
                name="email"
                type="email"
                class="form-control"
                autocomplete="username"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label" for="admin-password">Password</label>
              <input
                id="admin-password"
                name="password"
                type="password"
                class="form-control"
                autocomplete="current-password"
                required
              />
            </div>
            <button class="btn btn-primary btn-block" type="submit">Log in</button>
            <p id="login-feedback" class="form-feedback" role="status" aria-live="polite"></p>
          </form>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-login.js"></script>
  </body>
</html>
