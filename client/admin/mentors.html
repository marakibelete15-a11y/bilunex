<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bilunex administrator portal — active mentors." />
    <title>Active Mentors | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/portal.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-heading">Skip to content</a>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container portal-layout">
        <section class="portal-main">
          <header class="page-header">
            <h1 id="main-heading">Active Mentors</h1>
            <p>
              Verified university mentors active or currently onboarding in the Bilunex peer
              tutoring network.
            </p>
          </header>

          <div id="mentors-metrics" class="portal-metrics-grid"></div>

          <form id="filters" class="admin-filters">
            <label
              >Search mentors<input
                name="search"
                type="search"
                placeholder="Search by name, email, university, department..."
            /></label>
            <button class="btn btn-primary" type="submit">Filter</button>
            <button class="btn btn-outline" type="button" id="reset-filters">Reset</button>
          </form>

          <div id="list-state" role="status" aria-live="polite"></div>
          <div id="mentors-table" class="table-responsive"></div>
          <nav id="pagination" class="admin-pagination" aria-label="Mentor pages"></nav>

          <!-- Modal for Active Mentor Profile Inspection -->
          <div id="mentor-details-modal" class="portal-modal-backdrop" aria-hidden="true">
            <div
              class="portal-modal-card"
              role="dialog"
              aria-modal="true"
              aria-labelledby="mentor-details-modal-title"
            >
              <header class="portal-modal-header">
                <h2 id="mentor-details-modal-title">Mentor Profile</h2>
                <button
                  type="button"
                  class="portal-modal-close"
                  id="mentor-details-modal-close-btn"
                  aria-label="Close dialog"
                >
                  &times;
                </button>
              </header>
              <div class="portal-modal-body" id="mentor-details-modal-body-content"></div>
              <footer class="portal-modal-footer">
                <button type="button" class="btn btn-outline" id="mentor-details-modal-cancel-btn">
                  Close
                </button>
              </footer>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-mentors.js"></script>
  </body>
</html>
