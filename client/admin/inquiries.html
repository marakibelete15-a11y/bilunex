<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Bilunex administrator portal — inquiries." />
    <title>Inquiries | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/portal.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-heading">Skip to content</a>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container portal-layout">
        <section class="portal-main">
          <header class="page-header">
            <h1 id="main-heading">Inquiries & Contact</h1>
            <p>
              Review and resolve inquiries, support requests, and counseling messages submitted
              through the platform.
            </p>
          </header>

          <div id="inquiries-metrics" class="portal-metrics-grid"></div>

          <form id="filters" class="admin-filters">
            <label
              >Search inquiries<input
                name="search"
                type="search"
                placeholder="Search by name, email, phone, keyword..."
            /></label>
            <label>
              Type
              <select name="inquiry_type">
                <option value="">All types</option>
                <option value="general">General</option>
                <option value="parent_support">Parent support</option>
                <option value="mentor_application">Mentor application</option>
                <option value="counseling">Counseling</option>
              </select>
            </label>
            <label>
              Status
              <select name="status">
                <option value="">All statuses</option>
                <option value="new">New</option>
                <option value="in_progress">In progress</option>
                <option value="resolved">Resolved</option>
                <option value="archived">Archived</option>
              </select>
            </label>
            <button class="btn btn-primary" type="submit">Apply filters</button>
            <button class="btn btn-outline" type="button" id="reset-filters">Reset</button>
          </form>

          <div id="list-state" role="status" aria-live="polite"></div>
          <div id="inquiries-table" class="table-responsive"></div>
          <nav id="pagination" class="admin-pagination" aria-label="Inquiry pages"></nav>

          <!-- Modal for Inquiry Review and Status Updates -->
          <div id="inquiry-modal" class="portal-modal-backdrop" aria-hidden="true">
            <div
              class="portal-modal-card"
              role="dialog"
              aria-modal="true"
              aria-labelledby="inquiry-modal-title"
            >
              <header class="portal-modal-header">
                <h2 id="inquiry-modal-title">Inquiry Details</h2>
                <button
                  type="button"
                  class="portal-modal-close"
                  id="inquiry-modal-close-btn"
                  aria-label="Close dialog"
                >
                  &times;
                </button>
              </header>
              <div class="portal-modal-body" id="inquiry-modal-body-content"></div>
              <footer class="portal-modal-footer">
                <button type="button" class="btn btn-outline" id="inquiry-modal-cancel-btn">
                  Close
                </button>
              </footer>
            </div>
          </div>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/admin-inquiries.js"></script>
  </body>
</html>
