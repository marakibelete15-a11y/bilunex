<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mentor Portal Login | Bilunex</title>
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body
    style="
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background-color: var(--color-bg);
    "
  >
    <div class="card" style="width: 100%; max-width: 420px; margin: var(--space-4)">
      <div style="text-align: center; margin-bottom: var(--space-6)">
        <a
          href="../public/index.html"
          class="brand-logo"
          style="justify-content: center; margin-bottom: var(--space-2)"
        >
          Bilunex <span class="brand-tag">Mentor Portal</span>
        </a>
        <p style="color: var(--color-text-muted); font-size: var(--font-size-sm)">
          Sign in to access your assigned students and submit session reports.
        </p>
      </div>

      <div id="login-feedback"></div>

      <form id="mentor-login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">Mentor Email <span class="required">*</span></label>
          <input
            type="email"
            id="email"
            class="form-control"
            placeholder="mentor@example.com"
            required
          />
          <div class="form-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">Password <span class="required">*</span></label>
          <input
            type="password"
            id="password"
            class="form-control"
            placeholder="••••••••••••"
            required
          />
          <div class="form-error"></div>
        </div>

        <button type="submit" id="submit-btn" class="btn btn-secondary btn-block">
          Sign In to Mentor Portal
        </button>
      </form>

      <div
        style="
          margin-top: var(--space-4);
          text-align: center;
          font-size: var(--font-size-sm);
          color: var(--color-text-muted);
        "
      >
        Want to join our team? <a href="../public/become-a-mentor.html">Apply to become a mentor</a>
      </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/validation.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/auth.js"></script>
    <script>
      const form = document.getElementById('mentor-login-form');
      const submitBtn = document.getElementById('submit-btn');

      form.addEventListener('submit', async e => {
        e.preventDefault();
        formValidator.clearAllErrors(form);

        const email = document.getElementById('email');
        const password = document.getElementById('password');

        let isValid = true;
        if (!formValidator.isValidEmail(email.value)) {
          formValidator.showError(email, 'Valid email required');
          isValid = false;
        }
        if (!formValidator.isRequired(password.value)) {
          formValidator.showError(password, 'Password required');
          isValid = false;
        }

        if (!isValid) return;

        try {
          ui.setLoading(submitBtn, true, 'Signing in...');
          const res = await apiClient.post('/mentor/auth/login', {
            email: email.value.trim(),
            password: password.value,
          });

          // Store JWT token and user info
          auth.setSession(res.data.token, res.data.user);
          window.location.href = 'profile.html';
        } catch (err) {
          ui.showAlert('#login-feedback', 'error', err.message || 'Invalid credentials');
        } finally {
          ui.setLoading(submitBtn, false);
        }
      });
    </script>
  </body>
</html>
