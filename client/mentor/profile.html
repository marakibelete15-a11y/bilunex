<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bilunex mentor portal — mentor profile and own support reports."
    />
    <title>My Profile | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
    <link rel="stylesheet" href="../css/portal.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-heading">Skip to content</a>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container portal-layout">
        <section class="portal-main">
          <header
            class="page-header"
            style="
              display: flex;
              justify-content: space-between;
              align-items: flex-start;
              flex-wrap: wrap;
              gap: 1rem;
            "
          >
            <div>
              <h1 id="main-heading">My Profile</h1>
              <p>Your verified Bilunex mentor profile details and availability.</p>
            </div>
            <div class="page-header-actions" style="display: flex; gap: 0.75rem; flex-wrap: wrap">
              <button type="button" id="edit-profile-btn" class="btn btn-outline">
                Edit profile
              </button>
              <a href="report.html" class="btn btn-primary">Submit student report</a>
            </div>
          </header>

          <section class="card mentor-identity">
            <h2>Profile Details</h2>
            <dl>
              <div>
                <dt>Name</dt>
                <dd id="profile-name">Loading…</dd>
              </div>
              <div>
                <dt>Email</dt>
                <dd id="profile-email">Loading…</dd>
              </div>
              <div>
                <dt>University</dt>
                <dd id="profile-university">Loading…</dd>
              </div>
              <div>
                <dt>Field of Study</dt>
                <dd id="profile-field">Loading…</dd>
              </div>
              <div>
                <dt>Subject Specializations</dt>
                <dd id="profile-subjects-display">—</dd>
              </div>
              <div>
                <dt>Availability</dt>
                <dd id="profile-avail-display">—</dd>
              </div>
            </dl>
          </section>

          <section id="edit-profile-section" class="card mentor-edit-card">
            <h2>Edit Profile</h2>
            <div id="profile-feedback" role="status" aria-live="polite"></div>
            <form id="profile-form">
              <label
                >Name<input
                  name="name"
                  type="text"
                  minlength="2"
                  required
                  placeholder="Your full name"
              /></label>
              <label
                >University<input
                  name="university"
                  type="text"
                  minlength="2"
                  required
                  placeholder="e.g. Addis Ababa University"
              /></label>
              <label
                >Field of Study<input
                  name="field_of_study"
                  type="text"
                  minlength="2"
                  required
                  placeholder="e.g. Computer Science"
              /></label>
              <label>
                Subject Specializations
                <span class="help-text"
                  >Separate subjects with commas (e.g. Mathematics, Physics, Chemistry).</span
                >
                <input
                  name="subject_specializations"
                  type="text"
                  required
                  placeholder="Mathematics, English, Physics"
                />
              </label>
              <label
                >Availability<input
                  name="availability"
                  type="text"
                  minlength="2"
                  required
                  placeholder="e.g. Weekday afternoons, Saturdays"
              /></label>
              <button class="btn btn-primary" type="submit">Save profile</button>
            </form>
          </section>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/mentor-profile.js"></script>
  </body>
</html>
