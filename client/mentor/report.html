<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Bilunex mentor portal — submit and review own support reports."
    />
    <title>Support Reports | Bilunex</title>
    <link rel="icon" type="image/svg+xml" href="../assets/images/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="../assets/images/favicon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="../assets/images/apple-touch-icon.png" />
    <link rel="shortcut icon" href="../assets/images/favicon.ico" />
    <link rel="stylesheet" href="../css/base.css" />
    <link rel="stylesheet" href="../css/layout.css" />
    <link rel="stylesheet" href="../css/components.css" />
    <link rel="stylesheet" href="../css/pages.css" />
  </head>
  <body>
    <a class="skip-link" href="#main-heading">Skip to content</a>
    <header id="portal-header" class="site-header"></header>
    <main class="main-content">
      <div class="container portal-layout">
        <section class="portal-main">
          <header class="page-header">
            <h1 id="main-heading">Student support report</h1>
            <p>Record the support need, observations and recommended next action.</p>
          </header>
          <section class="card mentor-edit-card">
            <div id="report-feedback" role="status" aria-live="polite"></div>
            <form id="support-report-form">
              <label
                >Student name<input name="student_name" type="text" minlength="2" required /></label
              ><label
                >Support need observed<input
                  name="support_need_observed"
                  type="text"
                  minlength="2"
                  required /></label
              ><label
                >Observations<textarea
                  name="observations"
                  minlength="10"
                  required
                ></textarea></label
              ><label
                >Recommended action<textarea
                  name="recommended_action"
                  minlength="2"
                  required
                ></textarea></label
              ><button class="btn btn-primary" type="submit">File support report</button>
            </form>
          </section>
          <section class="card mentor-reports-card">
            <h2>My support reports</h2>
            <p>Only reports submitted by this mentor account are shown.</p>
            <div id="reports-table" role="status" aria-live="polite"></div>
          </section>
        </section>
      </div>
    </main>
    <script type="module" src="../js/pages/mentor-report.js"></script>
  </body>
</html>
